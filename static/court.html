<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>場地計分</title>
  <link rel="stylesheet" href="/static/pixel.css">
  <style>
    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      background: var(--walnut);
      color: var(--line);
      padding: 10px 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #header-left { font-size: min(5.5vw, 24px); white-space: nowrap; }
    #header-left .hdr-sub { font-size: min(3vw, 13px); color: var(--maple-deep); margin-left: 0.4em; }
    #header-right { font-size: min(3.4vw, 15px); color: var(--maple-deep); text-align: right; }
    #header-right .r { color: #FF8A6B; }
    #header-right .w { color: var(--line); }

    /* ── Status bar ── */
    #status {
      justify-content: center;
      font-size: min(3vw, 13px);
      padding: 4px;
      background: var(--paper);
      flex-shrink: 0;
      display: flex;
    }

    /* ── Lobby screen ── */
    #lobby {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      padding: 20px;
      min-height: 0;
      overflow-y: auto;      /* 手機橫放時高度不夠，讓表單可捲動 */
    }
    #lobby-card {
      width: 100%;
      max-width: 360px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }
    #lobby-heading { font-size: min(6vw, 26px); text-align: center; }
    #lobby-progress { font-size: min(3.5vw, 15px); color: var(--varnish); text-align: center; min-height: 1em; }

    .field-label {
      font-size: min(3.8vw, 16px);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot-red, .dot-white { width: 10px; height: 10px; flex-shrink: 0; }
    .dot-red   { background: var(--red); }
    .dot-white { background: var(--line); box-shadow: 0 0 0 2px var(--walnut); }
    .player-input {
      width: 100%;
      font-family: var(--font);
      font-size: min(5.5vw, 24px);
      color: var(--walnut);
      background: var(--line);
      border: none;
      padding: 12px 14px;
      outline: none;
      box-shadow: inset 0 0 0 var(--px) var(--walnut);
    }
    .player-input::placeholder { color: var(--maple-deep); }
    .player-input:focus { box-shadow: inset 0 0 0 var(--px) var(--live); }

    #btn-start { font-size: min(6vw, 26px); padding: 14px; margin-top: 4px; }

    /* ── Match screen ── */
    #match {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    #courts-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    /* 兩隊之間的球網 */
    #net {
      width: 10px;
      flex-shrink: 0;
      background:
        repeating-conic-gradient(var(--walnut) 0 25%, var(--line) 0 50%) 0 0 / 5px 5px;
      border-left: 2px solid var(--walnut);
      border-right: 2px solid var(--walnut);
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .team:active { filter: brightness(1.12); }
    .team.red   { background: var(--red);  color: var(--line); }
    .team.white { background: var(--line); color: var(--walnut); }
    .team-label { font-size: min(4.5vw, 19px); }
    .team-hint  { font-size: min(3vw, 13px); opacity: 0.7; }
    .score { font-size: min(24vw, 32vh); line-height: 1; font-variant-numeric: tabular-nums; }
    .btn-row { display: flex; gap: 10px; }
    /* 手機橫放等矮螢幕：縮小比分、拿掉提示，避免被上下列遮住 */
    @media (max-height: 500px) {
      .team { gap: 6px; }
      .team-hint { display: none; }
      .score { font-size: min(24vw, 22vh); }
    }
    .score-btn { width: min(20vw, 120px); height: 64px; font-size: min(6.5vw, 28px); }
    .team.red .score-btn { background: #7E1A11; }

    #end-bar {
      flex-shrink: 0;
      padding: 10px 14px 14px;
      background: var(--walnut);
      display: flex;
    }
    #btn-end { flex: 1; font-size: min(4.8vw, 21px); padding: 12px; box-shadow: none; margin: 0; }
    #btn-end:active { top: 2px; }

    /* ── Confirm overlay ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(59, 35, 20, 0.75);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    .overlay.show { display: flex; }
    .dialog {
      padding: 26px 20px 18px;
      max-width: 320px;
      width: 88%;
      text-align: center;
    }
    .dialog-score { font-size: min(12vw, 52px); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .dialog-score .w { color: var(--walnut); }
    .dialog-score .sep { color: var(--maple-deep); margin: 0 0.25em; }
    .dialog-players { font-size: min(3.8vw, 16px); color: var(--varnish); margin-bottom: 18px; }
    .dialog p { margin-bottom: 18px; font-size: 16px; line-height: 1.6; }
    .dialog-btns { display: flex; gap: 12px; }
    .dialog-btn { flex: 1; font-size: 16px; padding: 12px; }
  </style>
</head>
<body>
  <div id="header">
    <div id="header-left">場地 <span id="court-num">-</span></div>
    <div id="header-right" id="header-matchup"></div>
  </div>
  <div id="status" class="conn">連線中...</div>

  <!-- Lobby -->
  <div id="lobby">
   <div id="lobby-card" class="px-frame">
    <div id="lobby-heading">下一場對戰</div>
    <div id="lobby-progress"></div>
    <div class="field-group">
      <div class="field-label"><span class="dot-red"></span>紅隊選手</div>
      <input class="player-input" id="input-red" type="text" placeholder="例：W1" autocomplete="off">
    </div>
    <div class="field-group">
      <div class="field-label"><span class="dot-white"></span>白隊選手</div>
      <input class="player-input" id="input-white" type="text" placeholder="例：B1" autocomplete="off">
    </div>
    <button id="btn-start" class="px-btn go" onclick="startMatch()">開始比賽</button>
   </div>
  </div>

  <!-- Match -->
  <div id="match">
    <div id="courts-area">
      <div class="team red" onclick="send('red', 1)">
        <div class="team-label">紅隊</div>
        <div class="score" id="red-score">0</div>
        <div class="team-hint">點這半邊 +1</div>
        <div class="btn-row">
          <button class="score-btn px-btn" onclick="event.stopPropagation(); send('red', -1)">-1</button>
        </div>
      </div>
      <div id="net"></div>
      <div class="team white" onclick="send('white', 1)">
        <div class="team-label">白隊</div>
        <div class="score" id="white-score">0</div>
        <div class="team-hint">點這半邊 +1</div>
        <div class="btn-row">
          <button class="score-btn px-btn" onclick="event.stopPropagation(); send('white', -1)">-1</button>
        </div>
      </div>
    </div>
    <div id="end-bar">
      <button id="btn-end" class="px-btn paper" onclick="showEndConfirm()">結束本場</button>
    </div>
  </div>

  <!-- End confirm dialog -->
  <div class="overlay" id="end-overlay">
    <div class="dialog px-frame">
      <div class="dialog-score">
        <span class="r" id="dlg-red">0</span>
        <span class="sep">:</span>
        <span class="w" id="dlg-white">0</span>
      </div>
      <div class="dialog-players" id="dlg-players"></div>
      <p>確定結束本場比賽？</p>
      <div class="dialog-btns">
        <button class="dialog-btn px-btn paper" onclick="closeConfirm()">取消</button>
        <button class="dialog-btn px-btn red" onclick="endMatch()">結束本場</button>
      </div>
    </div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const courtId = parseInt(params.get('id')) || 1;
    document.getElementById('court-num').textContent = courtId;
    document.title = `場地 ${courtId}`;

    let ws = null;
    let currentCourt = null;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        document.getElementById('status').textContent = '已連線';
        document.getElementById('status').className = 'conn connected';
      };
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'update') applyUpdate(data);
      };
      ws.onclose = () => {
        document.getElementById('status').textContent = '連線中...';
        document.getElementById('status').className = 'conn';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    function applyUpdate(data) {
      const court = data.courts[String(courtId)];
      if (!court) return;
      currentCourt = court;
      if (court.match_active) {
        showMatch(court);
      } else {
        showLobby(court);
      }
    }

    function showLobby(court) {
      document.getElementById('lobby').style.display = 'flex';
      document.getElementById('match').style.display = 'none';

      // pre-fill inputs only if not focused (don't interrupt user typing)
      const rIn = document.getElementById('input-red');
      const wIn = document.getElementById('input-white');
      if (document.activeElement !== rIn) rIn.value = court.red_player || '';
      if (document.activeElement !== wIn) wIn.value = court.white_player || '';

      const total = court.matches_total || 0;
      const done  = court.match_index  || 0;
      const prog  = document.getElementById('lobby-progress');
      const head  = document.getElementById('lobby-heading');

      if (total > 0 && done >= total) {
        head.textContent = '加賽 / 臨時比賽';
        prog.textContent = `賽程 ${total} 場已全部完成`;
      } else if (total > 0) {
        head.textContent = '下一場對戰';
        prog.textContent = `第 ${done + 1} 場 / 共 ${total} 場`;
      } else {
        head.textContent = '比賽資訊';
        prog.textContent = '';
      }

      document.getElementById('header-right').textContent = '';
    }

    function showMatch(court) {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('match').style.display = 'flex';

      document.getElementById('red-score').textContent   = court.red;
      document.getElementById('white-score').textContent = court.white;

      const hr = document.getElementById('header-right');
      if (court.red_player || court.white_player) {
        hr.innerHTML = `<span class="r">${court.red_player || '紅隊'}</span> 對 <span class="w">${court.white_player || '白隊'}</span>`;
      } else {
        hr.textContent = '';
      }

      // update progress in header
      const total = court.matches_total || 0;
      const done  = court.match_index  || 0;
      if (total > 0) {
        document.getElementById('header-left').innerHTML =
          `場地 ${courtId}<span class="hdr-sub">第${done + 1}/${total}場</span>`;
      }
    }

    function send(team, delta) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ court: courtId, team, delta }));
      }
    }

    async function startMatch() {
      const red   = document.getElementById('input-red').value.trim();
      const white = document.getElementById('input-white').value.trim();
      await fetch(`/court/${courtId}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ red_player: red, white_player: white }),
      });
    }

    function showEndConfirm() {
      if (!currentCourt) return;
      document.getElementById('dlg-red').textContent   = currentCourt.red;
      document.getElementById('dlg-white').textContent = currentCourt.white;
      const rp = currentCourt.red_player   || '紅隊';
      const wp = currentCourt.white_player || '白隊';
      document.getElementById('dlg-players').textContent = `${rp} 對 ${wp}`;
      document.getElementById('end-overlay').classList.add('show');
    }

    async function endMatch() {
      closeConfirm();
      await fetch(`/court/${courtId}/end`, { method: 'POST' });
    }

    function closeConfirm() {
      document.getElementById('end-overlay').classList.remove('show');
    }

    connect();
  </script>
</body>
</html>
