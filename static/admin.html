<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理頁面</title>
  <link rel="stylesheet" href="/static/pixel.css">
  <style>
    body {
      min-height: 100dvh;
      padding: 20px 16px 60px;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    #conn-status { margin-bottom: 24px; }

    .section { padding: 16px; margin-bottom: 28px; }
    .section-title { font-size: 18px; margin-bottom: 12px; }

    .btn-sm    { font-size: 14px; padding: 6px 10px; }
    .btn-block { display: flex; width: calc(100% - var(--px) * 2); padding: 12px; }

    /* ── Schedule section ── */
    .upload-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .file-label input[type="file"] { display: none; }
    #schedule-info { font-size: 14px; color: var(--varnish); margin-bottom: 10px; min-height: 18px; }
    #csv-preview { display: none; margin-bottom: 12px; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
    .preview-table th, .preview-table td { border: 2px solid var(--maple-deep); padding: 5px 8px; white-space: nowrap; }
    .preview-table th { background: var(--maple); }
    .preview-table td { background: var(--line); }

    /* ── Totals ── */
    .totals-row { display: flex; gap: 16px; }
    .total-card { flex: 1; padding: 12px; text-align: center; }
    .total-card.red   { background: var(--red); color: var(--line); }
    .total-card.white { background: var(--line); }
    .total-card .tlabel { font-size: 14px; }
    .total-card .tscore { font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* ── Court status rows ── */
    #court-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .court-row { background: var(--line); padding: 12px 14px; box-shadow: inset 0 0 0 2px var(--maple-deep); }
    .court-row.active-row { box-shadow: inset 0 0 0 var(--px) var(--live); }
    .court-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .court-name { font-size: 16px; }
    .court-progress { font-size: 13px; color: var(--varnish); }
    .court-players  { font-size: 15px; margin-bottom: 8px; min-height: 20px; color: var(--varnish); }
    .court-score    { font-size: 22px; margin-bottom: 8px; }
    .court-score .w { color: var(--walnut); }
    .sep { color: var(--maple-deep); }
    .court-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .court-btns .px-btn.paper.r { color: var(--red); }

    /* ── History ── */
    #history-list { display: flex; flex-direction: column; }
    .history-entry { padding: 10px 2px; border-bottom: 2px solid var(--maple-deep); }
    .history-entry:last-child { border-bottom: none; }
    .he-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .he-title  { font-size: 15px; }
    .he-meta   { font-size: 13px; color: var(--varnish); margin-left: 8px; }
    .he-score  { font-size: 16px; }
    .he-score .w { color: var(--walnut); }
    .he-players { font-size: 13px; color: var(--varnish); }
    .empty-note { font-size: 14px; color: var(--varnish); }

    /* ── Confirm overlay ── */
    .confirm-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(59, 35, 20, 0.75);
      align-items: center; justify-content: center; z-index: 100;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box { padding: 26px 22px 18px; max-width: 340px; width: 90%; text-align: center; }
    .confirm-box p { margin-bottom: 20px; font-size: 16px; line-height: 1.6; }
    .confirm-actions { display: flex; gap: 12px; }
    .confirm-actions .px-btn { flex: 1; padding: 12px; }
  </style>
</head>
<body>
 <main>
  <h1>管理頁面</h1>
  <div id="conn-status" class="conn">連線中...</div>

  <!-- 1. 賽程設定 -->
  <div class="section px-frame">
    <h2 class="section-title">賽程設定</h2>
    <div class="upload-row">
      <a class="px-btn paper" href="/static/template.csv" download="schedule_template.csv">下載範本 CSV</a>
      <label class="px-btn file-label">選擇賽程 CSV<input type="file" accept=".csv,.txt" onchange="handleCSVFile(this)"></label>
    </div>
    <div id="schedule-info">尚未載入賽程</div>
    <div id="csv-preview">
      <div style="overflow-x:auto;margin-bottom:10px">
        <table class="preview-table" id="preview-table"></table>
      </div>
      <button class="px-btn go btn-block" onclick="submitSchedule()">上傳賽程（會清空歷史與累積分）</button>
    </div>
  </div>

  <!-- 2. 目前總分 -->
  <div class="section px-frame">
    <h2 class="section-title">目前總分（累積）</h2>
    <div class="totals-row">
      <div class="total-card red px-frame">
        <div class="tlabel">紅隊</div>
        <div class="tscore" id="total-red">0</div>
      </div>
      <div class="total-card white px-frame">
        <div class="tlabel">白隊</div>
        <div class="tscore" id="total-white">0</div>
      </div>
    </div>
  </div>

  <!-- 3. 場地狀態 -->
  <div class="section px-frame">
    <h2 class="section-title">場地狀態</h2>
    <div id="court-list"></div>
    <button class="px-btn paper btn-block" onclick="addCourt()">新增場地</button>
  </div>

  <!-- 4. 歷史紀錄 -->
  <div class="section px-frame">
    <h2 class="section-title">歷史紀錄</h2>
    <div id="history-list"><div class="empty-note">尚無紀錄，場地結束一場後會出現在這裡</div></div>
  </div>

  <!-- Confirm dialog -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box px-frame">
      <p id="confirm-msg"></p>
      <div class="confirm-actions">
        <button class="px-btn paper" onclick="closeConfirm()">取消</button>
        <button class="px-btn red" id="confirm-ok-btn">確定</button>
      </div>
    </div>
  </div>
 </main>

  <script>
    let ws = null;
    let lastData = null;
    let pendingSchedule = null;

    // ── WebSocket ──────────────────────────────────────────────
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        document.getElementById('conn-status').textContent = '已連線';
        document.getElementById('conn-status').className = 'conn connected';
      };
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'update') applyUpdate(d);
      };
      ws.onclose = () => {
        document.getElementById('conn-status').textContent = '連線中...';
        document.getElementById('conn-status').className = 'conn';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    function applyUpdate(data) {
      lastData = data;
      document.getElementById('total-red').textContent   = data.cumulative.red   + data.totals.red;
      document.getElementById('total-white').textContent = data.cumulative.white + data.totals.white;
      renderCourts(data.courts);
      renderHistory(data.history);
      if (data.schedule.length > 0 && pendingSchedule === null) {
        const n = Object.keys(data.schedule[0]?.courts || {}).length;
        document.getElementById('schedule-info').textContent =
          `已載入 ${data.schedule.length} 局，${n} 個場地`;
      }
    }

    // ── Courts ─────────────────────────────────────────────────
    function renderCourts(courts) {
      const list = document.getElementById('court-list');
      const ids = Object.keys(courts).sort((a, b) => Number(a) - Number(b));

      list.innerHTML = ids.map(id => {
        const c = courts[id];
        const total   = c.matches_total || 0;
        const done    = c.match_index   || 0;
        const active  = c.match_active;
        const allDone = total > 0 && done >= total && !active;

        let badge, playersHtml;
        if (active) {
          badge = '<span class="tag live">進行中</span>';
          playersHtml = `<span class="r">${c.red_player || '紅隊'}</span> 對 <span class="w">${c.white_player || '白隊'}</span>`;
        } else if (allDone) {
          badge = '<span class="tag muted">已完成</span>';
          playersHtml = total > 0 ? `全 ${total} 場完畢` : '';
        } else {
          badge = '<span class="tag">待開始</span>';
          const rp = c.red_player, wp = c.white_player;
          playersHtml = (rp || wp)
            ? `下一場：<span class="r">${rp || '?'}</span> 對 <span class="w">${wp || '?'}</span>`
            : '尚無對戰資訊';
        }

        const progress = total > 0
          ? `第 ${active ? done + 1 : done + 1} / ${total} 場`
          : '';

        const scoreHtml = active
          ? `<div class="court-score"><span class="r">${c.red}</span> <span class="sep">:</span> <span class="w">${c.white}</span></div>`
          : '';

        const forceEndBtn = active
          ? `<button class="px-btn amber btn-sm" onclick="confirmAction('強制結束場地 ${id} 的比賽？', () => forceEnd(${id}))">強制結束</button>`
          : '';

        return `
          <div class="court-row ${active ? 'active-row' : ''}">
            <div class="court-top">
              ${badge}
              <span class="court-name">場地 ${id}</span>
              ${progress ? `<span class="court-progress">${progress}</span>` : ''}
            </div>
            <div class="court-players">${playersHtml}</div>
            ${scoreHtml}
            <div class="court-btns">
              ${forceEndBtn}
              <a class="px-btn btn-sm" href="/court?id=${id}" target="_blank">開啟計分頁</a>
              <button class="px-btn paper btn-sm" onclick="confirmAction('重置場地 ${id} 分數？', () => resetCourt(${id}))">重置分數</button>
              <button class="px-btn paper btn-sm r" onclick="confirmAction('移除場地 ${id}？', () => removeCourt(${id}))">移除</button>
            </div>
          </div>`;
      }).join('');
    }

    // ── History ────────────────────────────────────────────────
    function renderHistory(history) {
      const el = document.getElementById('history-list');
      if (!history || history.length === 0) {
        el.innerHTML = '<div class="empty-note">尚無紀錄，場地結束一場後會出現在這裡</div>';
        return;
      }
      el.innerHTML = [...history].reverse().map(h => `
        <div class="history-entry">
          <div class="he-header">
            <div>
              <span class="he-title">場地 ${h.court}</span>
              <span class="he-meta">第 ${h.round} 局${h.time ? ' · ' + h.time : ''}</span>
            </div>
            <div class="he-score"><span class="r">${h.red}</span> : <span class="w">${h.white}</span></div>
          </div>
          <div class="he-players">
            <span class="r">${h.red_player || '紅隊'}</span> 對
            <span class="w">${h.white_player || '白隊'}</span>
          </div>
        </div>`).join('');
    }

    // ── CSV ────────────────────────────────────────────────────
    function handleCSVFile(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => parseAndPreviewCSV(e.target.result);
      reader.readAsText(file, 'UTF-8');
      input.value = '';
    }

    function parseAndPreviewCSV(text) {
      const lines = text.trim().split(/\r?\n/).map(l => l.trim()).filter(l => l);
      if (lines.length < 2) { alert('CSV 格式錯誤：至少需要標題和一筆資料'); return; }
      const header = lines[0].split(',').map(s => s.trim());
      const courtCount = Math.floor((header.length - 2) / 2);
      if (courtCount < 1) { alert('CSV 格式錯誤：找不到場地欄位'); return; }

      const schedule = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(s => s.trim());
        const rNum = parseInt(cols[0]);
        if (isNaN(rNum)) continue;
        const courts = {};
        for (let c = 0; c < courtCount; c++) {
          courts[String(c + 1)] = {
            red_player:   cols[2 + c * 2]     || '',
            white_player: cols[2 + c * 2 + 1] || '',
          };
        }
        schedule.push({ round: rNum, time: cols[1] || '', courts });
      }
      if (schedule.length === 0) { alert('CSV 無有效資料'); return; }

      pendingSchedule = schedule;
      document.getElementById('schedule-info').textContent =
        `解析完成：${schedule.length} 局，${courtCount} 個場地 — 請確認後上傳`;

      const table = document.getElementById('preview-table');
      table.innerHTML =
        `<tr>${header.map(h => `<th>${h}</th>`).join('')}</tr>` +
        lines.slice(1).map(l =>
          `<tr>${l.split(',').map(c => `<td>${c.trim()}</td>`).join('')}</tr>`
        ).join('');
      document.getElementById('csv-preview').style.display = 'block';
    }

    async function submitSchedule() {
      if (!pendingSchedule) return;
      const res = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schedule: pendingSchedule }),
      });
      if (res.ok) {
        pendingSchedule = null;
        document.getElementById('csv-preview').style.display = 'none';
      } else {
        alert('上傳失敗');
      }
    }

    // ── Court actions ──────────────────────────────────────────
    async function addCourt()       { await fetch('/court/add',          { method: 'POST' }); }
    async function removeCourt(id)  { await fetch(`/court/remove/${id}`, { method: 'POST' }); }
    async function resetCourt(id)   { await fetch(`/reset/${id}`,        { method: 'POST' }); }
    async function forceEnd(id)     { await fetch(`/court/${id}/end`,    { method: 'POST' }); }

    // ── Confirm dialog ─────────────────────────────────────────
    function confirmAction(msg, fn) {
      document.getElementById('confirm-msg').textContent = msg;
      document.getElementById('confirm-ok-btn').onclick = () => { closeConfirm(); fn(); };
      document.getElementById('confirm-overlay').classList.add('show');
    }
    function closeConfirm() {
      document.getElementById('confirm-overlay').classList.remove('show');
    }

    connect();
  </script>
</body>
</html>
