<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽球團體賽 — 賽程表</title>
  <link rel="stylesheet" href="/static/pixel.css">
  <style>
    body {
      min-height: 100dvh;
      padding: 20px 16px 40px;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    #status { margin-bottom: 20px; }

    /* ── Cumulative bar ── */
    #cum-bar { display: none; gap: 16px; margin-bottom: 24px; max-width: 520px; }
    .cum-card { flex: 1; padding: 10px; text-align: center; }
    .cum-card.red   { background: var(--red); color: var(--line); }
    .cum-card.white { background: var(--line); }
    .cum-card .cl { font-size: 14px; }
    .cum-card .cs { font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* ── Schedule table ── */
    #no-schedule { text-align: center; color: var(--varnish); padding: 40px 16px; font-size: 16px; }

    .table-wrap { overflow-x: auto; padding: 0; }
    table { border-collapse: collapse; min-width: 100%; font-size: 14px; }
    th, td { border: 2px solid var(--maple-deep); padding: 8px 10px; white-space: nowrap; }
    thead th { background: var(--walnut); color: var(--line); border-color: var(--walnut); font-weight: normal; }
    td.time-cell { color: var(--varnish); font-size: 13px; }
    td.round-cell { text-align: center; }

    /* court cells */
    .cc { min-width: 120px; vertical-align: top; }
    .cc-players .vs { color: var(--varnish); margin: 0 5px; font-size: 12px; }
    .cc-score { font-size: 16px; margin-top: 4px; }
    .cc-score .w { color: var(--walnut); }
    .cc-score .sep { color: var(--maple-deep); margin: 0 2px; }
    .cc .tag { margin-top: 4px; font-size: 11px; }

    /* active row highlight */
    tr.has-active td { background: #E6EFD9; }
  </style>
</head>
<body>
 <main>
  <h1>羽球團體賽 賽程表</h1>
  <div id="status" class="conn">連線中...</div>

  <div id="cum-bar">
    <div class="cum-card red px-frame">
      <div class="cl">紅隊總分</div>
      <div class="cs" id="cum-red">0</div>
    </div>
    <div class="cum-card white px-frame">
      <div class="cl">白隊總分</div>
      <div class="cs" id="cum-white">0</div>
    </div>
  </div>

  <div id="schedule-container">
    <div id="no-schedule">賽程尚未公布，管理員上傳後會自動顯示</div>
  </div>
 </main>

  <script>
    let ws = null;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen    = () => { document.getElementById('status').textContent = '已連線'; document.getElementById('status').className = 'conn connected'; };
      ws.onmessage = (e) => { const d = JSON.parse(e.data); if (d.type === 'update') render(d); };
      ws.onclose   = () => { document.getElementById('status').textContent = '連線中...'; document.getElementById('status').className = 'conn'; setTimeout(connect, 2000); };
      ws.onerror   = () => ws.close();
    }

    function render(data) {
      const hasSchedule = data.schedule && data.schedule.length > 0;

      // cumulative bar
      const cumBar = document.getElementById('cum-bar');
      if (hasSchedule) {
        cumBar.style.display = 'flex';
        document.getElementById('cum-red').textContent   = data.cumulative.red   + data.totals.red;
        document.getElementById('cum-white').textContent = data.cumulative.white + data.totals.white;
      } else {
        cumBar.style.display = 'none';
      }

      const container = document.getElementById('schedule-container');
      if (!hasSchedule) {
        container.innerHTML = '<div id="no-schedule">賽程尚未公布，管理員上傳後會自動顯示</div>';
        return;
      }

      // build lookup: history keyed by "court-round"
      const histMap = {};
      for (const h of data.history) {
        histMap[`${h.court}-${h.round}`] = h;
      }

      // determine which court-round is currently active
      // court.match_index tells us which position in the court's queue is current
      const activeSet = new Set(); // "court-round" strings
      for (const [cid, court] of Object.entries(data.courts)) {
        if (court.match_active) {
          const q = court.queue || [];
          const idx = court.match_index || 0;
          if (q[idx]) activeSet.add(`${cid}-${q[idx].round}`);
        }
      }

      // get sorted court IDs from first round
      const courtIds = Object.keys(data.schedule[0]?.courts || {})
        .sort((a, b) => Number(a) - Number(b));

      // build table
      let html = `
        <div class="table-wrap px-frame">
          <table>
            <thead>
              <tr>
                <th>局</th>
                <th>時間</th>
                ${courtIds.map(id => `<th>場地 ${id}</th>`).join('')}
              </tr>
            </thead>
            <tbody>`;

      for (const round of data.schedule) {
        const rowHasActive = courtIds.some(cid => activeSet.has(`${cid}-${round.round}`));
        html += `<tr${rowHasActive ? ' class="has-active"' : ''}>`;
        html += `<td class="round-cell">${round.round}</td>`;
        html += `<td class="time-cell">${round.time || ''}</td>`;

        for (const cid of courtIds) {
          const entry = round.courts[cid];
          if (!entry) { html += '<td></td>'; continue; }

          const key     = `${cid}-${round.round}`;
          const isDone  = !!histMap[key];
          const isActive= activeSet.has(key);
          const hist    = histMap[key];

          let badge = '';
          if (isActive)     badge = '<div><span class="tag live">進行中</span></div>';
          else if (isDone)  badge = '<div><span class="tag muted">已完賽</span></div>';

          let scoreHtml = '';
          if (isDone) {
            scoreHtml = `<div class="cc-score"><span class="r">${hist.red}</span><span class="sep">:</span><span class="w">${hist.white}</span></div>`;
          } else if (isActive) {
            const c = data.courts[cid];
            scoreHtml = `<div class="cc-score"><span class="r">${c.red}</span><span class="sep">:</span><span class="w">${c.white}</span></div>`;
          }

          html += `
            <td class="cc">
              <div class="cc-inner">
                <div class="cc-players">
                  <span class="r">${entry.red_player || '?'}</span>
                  <span class="vs">對</span>
                  <span class="w">${entry.white_player || '?'}</span>
                </div>
                ${scoreHtml}
                ${badge}
              </div>
            </td>`;
        }
        html += '</tr>';
      }

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    connect();
  </script>
</body>
</html>
